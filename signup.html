<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>u.live - Create Account</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <!-- Full Screen Loader -->
  <div class="global-loader" id="globalLoader">
    <div class="loader-spinner"></div>
    <p style="font-weight: 500; color: var(--text-main); font-size: 1rem;" id="loaderMsg">Creating Account...</p>
  </div>

  <div class="auth-wrapper">
    
    <!-- Left Form Column -->
    <div class="auth-form-column">
      
      <!-- FLOATING BRAND BADGE -->
      <a href="index.html" class="floating-brand-badge">
        <span class="brand-dot"></span>
        <span class="brand-text">u.live</span>
      </a>

      <div class="auth-form-content">
        
        <h1 class="auth-title">Create your account</h1>

        <div class="social-row-centered" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 24px;">
          <!-- <button type="button" class="social-btn" style="width: 50px; height: 50px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width: 22px; height: 22px;">
          </button>
          <button type="button" class="social-btn" style="width: 50px; height: 50px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <i class="ph-fill ph-facebook-logo" style="font-size: 24px; color: #1877F2;"></i>
          </button> -->
        </div>

        <form class="auth-form" id="signup-form">
          <div class="form-group">
            <div class="input-wrapper">
              <input type="text" id="signup-name" placeholder="Full Name" required>
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <input type="text" id="signup-username" placeholder="USERNAME" required pattern="[A-Z0-9_]+" oninput="this.value = this.value.toUpperCase().replace(/\s/g, '');">
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <input type="email" id="signup-email" placeholder="Email address" required>
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <input type="password" id="signup-password" placeholder="Password" required minlength="6">
            </div>
          </div>

          <button type="submit" class="btn-primary-auth" style="background: var(--text-main); color: var(--bg-card); margin-top: 12px;">Create account</button>
        </form>

        <p class="auth-switch-text" style="margin-top: 24px; text-align: center;">
          Already have an account? <a href="login.html">Sign In</a>
        </p>

      </div>
    </div>

    <!-- Right Graphic Column -->
    <div class="auth-graphic-column">
      <div class="graphic-frame">
        <img id="landscape" src="" alt="3D Illustration">
      </div>
    </div>

  </div>

  <script>
    const images = ["images/s2.jpg", "images/s3.jpg", "images/s4.jpg"];
    const randomIdx = Math.floor(Math.random() * images.length);
    document.getElementById("landscape").src = images[randomIdx];
  </script>
  <script src="script.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
