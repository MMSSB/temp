<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>u.live - Sign In</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <!-- Full Screen Loader -->
  <div class="global-loader" id="globalLoader">
    <div class="loader-spinner"></div>
    <p style="font-weight: 500; color: var(--text-main); font-size: 1rem;" id="loaderMsg">Authenticating...</p>
  </div>

  <div class="auth-wrapper">
    
    <!-- Left Form Column -->
    <div class="auth-form-column">
      
      <!-- FLOATING BRAND BADGE (Logo with capsule background) -->
      <a href="index.html" class="floating-brand-badge">
        <span class="brand-dot"></span>
        <span class="brand-text">u.live</span>
      </a>

      <div class="auth-form-content">
        
        <h1 class="auth-title">Hello,<br>Welcome Back</h1>

        <!-- Social Icons Row (Centered like the reference image) -->
        <div class="social-row-centered" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 28px;">
          <!-- <button type="button" class="social-btn" style="width: 50px; height: 50px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width: 22px; height: 22px;">
          </button>
          <button type="button" class="social-btn" style="width: 50px; height: 50px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <i class="ph-fill ph-facebook-logo" style="font-size: 24px; color: #1877F2;"></i>
          </button> -->
        </div>

        <form class="auth-form" id="login-form">
          <div class="form-group">
            <div class="input-wrapper">
              <input type="text" id="login-email-user" placeholder="Email or Phone number" required oninput="this.value = this.value.toUpperCase().replace(/\s/g, '');">
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper">
              <input type="password" id="login-password" placeholder="Password" required>
            </div>
            <div style="text-align: right; margin-top: 8px;">
              <a href="#" style="font-size: 0.82rem; color: var(--text-main); text-decoration: none; font-weight: 500;">Forgot Password?</a>
            </div>
          </div>

          <button type="submit" class="btn-primary-auth" style="background: var(--text-main); color: var(--bg-card); margin-top: 12px;">Login</button>
        </form>

        <p class="auth-switch-text" style="margin-top: 24px; text-align: center;">
          Don't have an account? <a href="signup.html">Create One</a>
        </p>

      </div>
    </div>

    <!-- Right Graphic Column -->
    <div class="auth-graphic-column">
      <div class="graphic-frame">
        <img src="images/s1.jpg" alt="3D Illustration">
      </div>
    </div>

  </div>

  <script src="script.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
