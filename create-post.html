<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>u.live - Create Post</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
  
  <style>
    .create-page-layout {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-nav:hover { color: var(--text-main); }
    
    .editor-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }
    
    .post-textarea {
      width: 100%;
      min-height: 300px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--pill-bg);
      color: var(--text-main);
      resize: vertical;
      margin-bottom: 24px;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .post-textarea:focus { outline: none; border-color: var(--accent-color); }
    
    .btn-publish {
      width: 100%;
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent-color) 30%, transparent);
      transition: all 0.2s ease;
    }
    .btn-publish:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px color-mix(in srgb, var(--accent-color) 45%, transparent);
    }

    @media (max-width: 640px) {
      .create-page-layout { margin: 20px auto; }
      .editor-container { padding: 20px; border-radius: 20px; }
      .post-textarea { min-height: 40vh; }
    }
  </style>
</head>
<body>

  <header class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo floated-logo" style="text-decoration:none;">
        <span class="logo-icon"><i class="ph-fill ph-circle"></i></span>
        <span class="logo-text">u.live</span>
      </a>
      
      <div class="nav-actions">
        <div class="user-profile-menu">
          <button class="user-avatar-btn">
            <img src="images/user.png" alt="User">
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="create-page-layout">
    <a href="index.html" class="back-nav"><i class="ph ph-arrow-left"></i> Back to Feed</a>
    
    <div class="editor-container">
      <h2 style="margin-bottom: 20px; font-size: 1.5rem; color: var(--text-main);">Create a new post</h2>
      <!-- <form id="createPostForm">
        <textarea id="postContentInput" class="post-textarea" placeholder="What's on your mind? Share a project, snippet, or a thought..."></textarea>
        <button type="submit" class="btn-publish" id="publishPostBtn">Publish to Global Feed</button>
      </form> -->
      <form id="createPostForm" style="display: flex; flex-direction: column; flex: 1;">
  <textarea id="postContentInput" class="post-textarea" placeholder="What's on your mind? Share a project, snippet, or a thought..."></textarea>
  
  <!-- NEW: TAGS INPUT -->
  <input type="text" id="postTagsInput" class="post-tags-input" placeholder="Add tags: e.g. UI, Dashboard, Python (Comma separated)">
  
  <button type="submit" class="btn-publish" id="publishPostBtn">Publish</button>
</form>
    </div>
  </main>

  <script src="script.js"></script>
  <script type="module" src="log.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="posts.js"></script>
</body>
</html>
