<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>u.live - Demo Index 2 (Hero Portrait to Circle Shrink)</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floated Transparent Navbar (Solid when scrolled) -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo floated-logo" style="text-decoration:none;">
        <span class="logo-icon"><i class="ph-fill ph-circle"></i></span>
        <span class="logo-text">u.live <small style="font-size:0.65rem; color:#4f46e5;">(DEMO 2)</small></span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Original Index</a>
        <a href="#" class="active">Demo Index 2</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
      </nav>

      <div class="nav-actions">
        <div class="like-counter">
          <i class="ri-heart-fill heart-icon"></i>
          <span>21</span>
          <div class="toggle-switch" id="likeToggle">
            <div class="toggle-knob"></div>
          </div>
        </div>

        <button class="icon-btn search-btn" aria-label="Search">
          <i class="ph ph-magnifying-glass"></i>
        </button>

        <div class="user-profile-menu" id="userProfileMenu">
          <button class="user-avatar-btn" id="userAvatarBtn" aria-label="User Menu" title="User Menu">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="User">
          </button>

          <div class="profile-dropdown design-a" id="profileDropdown">
            <div class="dropdown-list">
              <a href="#" class="dropdown-item">
                <i class="ph ph-user"></i>
                <span>Profile</span>
              </a>
              <a href="index.html" class="dropdown-item">
                <i class="ph ph-arrow-left"></i>
                <span>Back to Index 1</span>
              </a>
              <a href="#" class="dropdown-item">
                <i class="ph ph-credit-card"></i>
                <span>Subscription</span>
                <span class="badge-pro pink">⚡ PRO</span>
              </a>
              <div class="dropdown-divider"></div>
              <a href="login.html" class="dropdown-item">
                <i class="ph ph-sign-out"></i>
                <span>Sign out</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Layout Area -->
  <main class="main-container">
    
    <!-- HERO PORTRAIT CARD (Starts Big Card -> Shrinks to Circle on Scroll) -->
    <aside class="profile-card hero-profile-card animate-fade-up" id="heroProfileCard" style="--delay: 0s;">
      
      <!-- Portrait Image Container -->
      <div class="hero-avatar-box">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=600&q=80" alt="Daniel Ayomide">
      </div>
      
      <div class="profile-header-text">
        <h1 class="profile-name">
          Daniel Ayomide <i class="ph-fill ph-check-circle verified-badge"></i>
        </h1>
        <p class="profile-bio">I design web and mobile apps that not only work seamlessly but also drive revenue growth for businesses.</p>
      </div>

      <div class="profile-stats">
        <div class="stat-item">
          <strong>600</strong> <span>Followers</span>
        </div>
        <div class="stat-item">
          <strong>100</strong> <span>Post</span>
        </div>
      </div>

      <button class="btn-mobile-follow" type="button">
        <i class="ph ph-plus"></i> Follow
      </button>

      <div class="profile-link">
        <i class="ph ph-link"></i>
        <a href="#" target="_blank">u.live/daniel</a>
      </div>

      <div class="social-links">
        <a href="#" aria-label="Twitter"><i class="ri-twitter-x-line"></i></a>
        <a href="#" aria-label="Dribbble"><i class="ri-dribbble-line"></i></a>
        <a href="#" aria-label="Behance"><i class="ri-behance-line"></i></a>
        <a href="#" aria-label="Instagram"><i class="ri-instagram-line"></i></a>
      </div>
    </aside>

    <!-- Right Column: Feed Assets -->
    <section class="content-area">
      
      <div class="feed-tabs animate-fade-up" style="--delay: 0.1s;">
        <button class="tab-btn active">My Work</button>
        <button class="tab-btn">Liked</button>
      </div>

      <div class="gallery-grid">
        
        <div class="card card-square animate-fade-up" style="--delay: 0.15s;">
          <div class="card-preview dark-preview">
            <div class="mock-widget">
              <div class="widget-header">
                <span class="dot"></span>
                <span>607</span>
              </div>
              <div class="chart-bars">
                <span style="height: 40%"></span>
                <span style="height: 80%"></span>
                <span style="height: 60%"></span>
                <span style="height: 90%"></span>
                <span style="height: 50%"></span>
                <span style="height: 75%"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="card card-square animate-fade-up" style="--delay: 0.2s;">
          <div class="card-preview light-preview">
            <img class="asset-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=500&q=80" alt="3D Blue Monster">
          </div>
        </div>

        <div class="card card-tall animate-fade-up" style="--delay: 0.25s;">
          <div class="card-preview dark-preview">
            <div class="mock-mobile-app">
              <div class="mock-nav"></div>
              <div class="mock-hero-box">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=200&q=80" alt="mini character">
              </div>
              <div class="mock-list">
                <div></div><div></div><div></div><div></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card card-square animate-fade-up" style="--delay: 0.3s;">
          <div class="card-preview light-preview">
            <div class="mock-list-widget">
              <div class="list-row"><span class="circle"></span><span class="line"></span></div>
              <div class="list-row"><span class="circle"></span><span class="line"></span></div>
              <div class="list-row"><span class="circle"></span><span class="line"></span></div>
            </div>
          </div>
        </div>

        <div class="card card-square animate-fade-up" style="--delay: 0.35s;">
          <div class="card-preview dark-preview">
            <div class="mock-finance">
              <small>Balance</small>
              <h3>$3,326</h3>
              <div class="mini-wave"></div>
              <button class="mock-btn">Send</button>
            </div>
          </div>
        </div>

        <div class="card card-small animate-fade-up" style="--delay: 0.4s;">
          <div class="card-preview dark-preview flex-center">
            <div class="mock-pill-bar">
              <span>Today</span>
              <i class="ph ph-caret-down"></i>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Mobile Floating Bottom Dock & Right FAB Button -->
  <div class="mobile-floating-dock" id="mobileFloatingDock">
    <nav class="mobile-nav-bar">
      <a href="#" class="mobile-nav-item active"><i class="ph-fill ph-house"></i></a>
      <a href="#" class="mobile-nav-item"><i class="ph ph-squares-four"></i></a>
      <a href="#" class="mobile-nav-item"><i class="ph ph-compass"></i></a>
      <a href="#" class="mobile-nav-item"><i class="ph ph-user"></i></a>
    </nav>
  </div>

  <button class="floating-right-fab" id="floatingRightFab" aria-label="Create Post" title="Create">
    <i class="ph ph-plus"></i>
  </button>

  <script src="script.js"></script>
</body>
</html>
